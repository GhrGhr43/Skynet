<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skynet</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css?v=version-20261009">
<script type="importmap">
{ "imports": {
    "three": "/static/vendor/three/three.module.min.js",
    "three/addons/": "/static/vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="fallback-glow" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<!-- Barra lateral: sesiones (como Claude/Codex) y, abajo, las secciones y la configuración -->
<aside class="side" id="side" aria-label="Sesiones">
  <div class="side-top">
    <span class="wordmark">Skynet</span>
    <button class="icon-btn" id="sideClose" data-icon="sidebar" aria-label="Ocultar barra lateral" title="Ocultar barra lateral (Ctrl+B)"></button>
  </div>
  <button class="side-new" id="newSession" title="Sesión nueva (Ctrl+Mayús+O)">
    <span data-icon="compose"></span><span class="grow">Nueva sesión</span><kbd>Ctrl ⇧ O</kbd>
  </button>
  <label class="side-search"><span data-icon="search"></span><input id="sessionSearch" placeholder="Buscar sesiones" autocomplete="off" aria-label="Buscar sesiones"></label>
  <nav class="side-list" id="sessionList" aria-label="Sesiones recientes"></nav>
  <nav class="side-nav" aria-label="Secciones">
    <button class="rail-btn" data-panel="tareas" data-icon="tasks"><span class="rail-tip">Tareas</span></button>
    <button class="rail-btn" data-panel="largo" data-icon="orbit"><span class="rail-tip">Tarea larga</span></button>
    <button class="rail-btn" data-panel="registro" data-icon="log"><span class="rail-tip">Registro</span></button>
    <button class="rail-btn" data-panel="diagnostico" data-icon="pulse"><span class="rail-tip">Diagnóstico</span></button>
    <button class="rail-btn" data-panel="ayuda" data-icon="spark"><span class="rail-tip">Qué puede hacer</span></button>
  </nav>
  <div class="side-foot">
    <button class="config-btn" id="configBtn" data-panel="ajustes" aria-label="Configuración">
      <span class="config-ico" data-icon="sliders"></span><span class="grow">Configuración</span>
    </button>
    <button class="learn" id="learnBtn" data-panel="aprendizaje" hidden title="Skynet ha aprendido algo y quiere tu visto bueno">
      <span class="learn-dot"></span><span id="learnN">0</span>
    </button>
  </div>
</aside>
<div class="side-scrim" id="sideScrim" aria-hidden="true"></div>

<main class="main">
  <header class="top">
    <button class="icon-btn side-open" id="sideOpen" data-icon="sidebar" aria-label="Mostrar barra lateral" title="Mostrar barra lateral (Ctrl+B)"></button>
    <button class="title" id="sessionTitle" title="Renombrar sesión"></button>
    <span class="grow"></span>
    <div class="status" id="status" role="status" aria-live="polite">
      <span class="status-dot"></span>
      <span class="status-label" id="statusLabel">Conectando</span>
      <span class="status-detail" id="statusDetail"></span>
    </div>
    <button class="icon-btn" id="paletteBtn" data-icon="command" aria-label="Acciones" title="Acciones (Ctrl+K)"></button>
  </header>

  <div class="hero" id="hero" aria-hidden="true">
    <h1 class="hero-title" id="heroTitle">¿En qué trabajamos?</h1>
    <p class="hero-sub" id="heroSub"></p>
  </div>

  <section class="convo" id="convo" aria-label="Conversación" aria-live="polite">
    <div class="convo-scroll" id="convoScroll">
      <div class="convo-inner" id="convoInner"></div>
    </div>
  </section>

  <footer class="dock">
    <div class="suggest" id="suggest"></div>
    <form class="prompt" id="prompt" autocomplete="off">
      <span class="prompt-glow" aria-hidden="true"></span>
      <textarea id="input" rows="1" placeholder="Pídele algo a Skynet…" aria-label="Mensaje para Skynet"></textarea>
      <div class="prompt-bar">
        <button type="button" class="prompt-plus" id="plusBtn" data-icon="plus" aria-label="Más: internet, modo coder…" title="Internet, modo coder…"></button>
        <span class="modes" id="modes"></span>
        <span class="grow"></span>
        <span class="tps" id="tps" title="Velocidad de la última respuesta"></span>
        <button type="button" class="meter" id="meter" title="Tokens" aria-label="Uso de tokens"></button>
        <button type="button" class="prompt-btn prompt-stop" id="stopBtn" data-icon="stop" aria-label="Detener" title="Detener (Esc). La tarea queda pausada"></button>
        <button type="submit" class="prompt-btn prompt-send" id="sendBtn" data-icon="send" aria-label="Enviar"></button>
      </div>
    </form>
    <!-- Contexto de trabajo, fuera de la caja: dónde, con qué permisos y con qué modelo -->
    <div class="under" id="under">
      <button type="button" class="mini" id="tabRepo" title="Repo en el que trabaja Skynet"></button>
      <button type="button" class="mini" id="btnPerm" title="Permisos del modelo: hasta dónde puede llegar en tu PC"></button>
      <span class="grow"></span>
      <button type="button" class="mini" id="btnModel" title="Modelo"></button>
      <button type="button" class="mini" id="btnEffort" title="Cuánto razona antes de responder"></button>
    </div>
  </footer>
</main>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <h2 class="panel-title" id="panelTitle"></h2>
    <button class="icon-btn" id="panelClose" data-icon="close" aria-label="Cerrar panel"></button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<div class="menu" id="menu" role="menu" hidden></div>
<div class="pop" id="meterPop" role="dialog" aria-label="Uso de tokens" hidden></div>

<div class="modal" id="pair" role="dialog" aria-modal="true" aria-labelledby="pairTitle" hidden>
  <div class="modal-card pair-card" id="pairCard"></div>
</div>

<div class="modal" id="ask" role="dialog" aria-modal="true" aria-labelledby="askTitle" hidden>
  <div class="modal-card" id="askCard"></div>
</div>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Acciones" hidden>
  <div class="palette-card">
    <div class="palette-search"><span data-icon="search"></span><input id="paletteInput" placeholder="¿Qué quieres hacer?" aria-label="Buscar acción"></div>
    <div class="palette-list" id="paletteList" role="listbox"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<!-- Temporal: qué copia se está ejecutando (commit y carpeta) -->
<div class="build" id="build" aria-hidden="true"></div>

<script src="/static/vendor/qrcode/qrcode.js" defer></script>
<script type="module" src="/static/js/main.js?v=version-20261009"></script>
</body>
</html>
