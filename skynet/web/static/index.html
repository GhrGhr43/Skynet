<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skynet</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#000000">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preload" href="/static/fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/css/app.css?v=internet-cursor-20261009">
<script type="importmap">
{ "imports": {
    "three": "/static/vendor/three/three.module.min.js",
    "three/addons/": "/static/vendor/three/addons/"
} }
</script>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="fallback-glow" aria-hidden="true"></div>
<div class="veil" aria-hidden="true"></div>

<header class="top">
  <div class="brand">
    <span class="wordmark">Skynet</span>
    <span class="brand-sub">Personal Agent OS</span>
  </div>
  <div class="status" id="status" role="status" aria-live="polite">
    <span class="status-dot"></span>
    <span class="status-label" id="statusLabel">Conectando</span>
    <span class="status-detail" id="statusDetail"></span>
  </div>
  <div class="chips">
    <button class="chip" id="chipProp" hidden title="Skills y memoria que Skynet propone: revísalas y apruébalas o recházalas">
      <span class="chip-k">Propuestas</span><span class="chip-v" id="chipPropV">0</span>
    </button>
  </div>
</header>

<nav class="rail" aria-label="Secciones">
  <button class="rail-btn" data-panel="conversacion" data-icon="chat" aria-label="Conversación"><span class="rail-tip">Conversación</span></button>
  <button class="rail-btn" data-panel="tareas" data-icon="tasks" aria-label="Tareas"><span class="rail-tip">Tareas</span></button>
  <button class="rail-btn" data-panel="largo" data-icon="orbit" aria-label="Tarea larga"><span class="rail-tip">Tarea larga</span></button>
  <button class="rail-btn" data-panel="registro" data-icon="log" aria-label="Registro"><span class="rail-tip">Registro y consumo</span></button>
  <button class="rail-btn" data-panel="diagnostico" data-icon="pulse" aria-label="Diagnóstico"><span class="rail-tip">Diagnóstico</span></button>
  <span class="rail-sep"></span>
  <button class="rail-btn" data-panel="ayuda" data-icon="spark" aria-label="Qué puede hacer"><span class="rail-tip">Qué puede hacer Skynet</span></button>
</nav>

<button class="config-btn" id="configBtn" data-panel="ajustes" aria-label="Configuración" title="Configuración">
  <span class="config-ico" data-icon="sliders"></span><span>Configuración</span>
</button>

<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <h2 class="panel-title" id="panelTitle"></h2>
    <button class="icon-btn" id="panelClose" data-icon="close" aria-label="Cerrar panel"></button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<section class="convo" id="convo" aria-label="Conversación" aria-live="polite">
  <div class="convo-scroll" id="convoScroll">
    <div class="convo-inner" id="convoInner"></div>
  </div>
</section>

<footer class="dock">
  <div class="suggest" id="suggest"></div>
  <div class="composer">
    <div class="tabs">
      <button type="button" class="tab" id="tabRepo" title="Repo en el que trabaja Skynet"></button>
      <button type="button" class="tab" id="tabWhere" title="Dónde piensa: Automático, Local (tu PC) o Nube"></button>
    </div>
    <form class="prompt" id="prompt" autocomplete="off">
      <span class="prompt-glow" aria-hidden="true"></span>
      <textarea id="input" rows="1" placeholder="Pídele algo a Skynet…" aria-label="Mensaje para Skynet"></textarea>
      <button type="button" class="prompt-btn prompt-stop" id="stopBtn" data-icon="stop" aria-label="Detener" title="Detener (la tarea queda pausada)"></button>
      <button type="submit" class="prompt-btn prompt-send" id="sendBtn" data-icon="arrow" aria-label="Enviar"></button>
    </form>
    <div class="meta-row">
      <button type="button" class="mini" id="btnPerm" title="Permisos del modelo: hasta dónde puede llegar en tu PC"></button>
      <button type="button" class="mini internet-toggle" id="btnInternet" data-icon="globe" aria-label="Búsqueda en internet" aria-pressed="false" title="Activar búsqueda en internet"><span class="internet-label">Internet</span></button>
      <span class="grow"></span>
      <button type="button" class="mini" id="btnModel" title="Modelo"></button>
      <button type="button" class="mini" id="btnEffort" title="Cuánto razona antes de responder"></button>
    </div>
  </div>
</footer>
<div class="menu" id="menu" role="menu" hidden></div>

<div class="modal" id="ask" role="dialog" aria-modal="true" aria-labelledby="askTitle" hidden>
  <div class="modal-card" id="askCard"></div>
</div>

<div class="palette" id="palette" role="dialog" aria-modal="true" aria-label="Acciones" hidden>
  <div class="palette-card">
    <div class="palette-search"><span data-icon="search"></span><input id="paletteInput" placeholder="¿Qué quieres hacer?" aria-label="Buscar acción"></div>
    <div class="palette-list" id="paletteList" role="listbox"></div>
  </div>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script type="module" src="/static/js/main.js?v=internet-cursor-20261009"></script>
</body>
</html>
