# Model router: los agentes piden capacidades {privacy, coding, reasoning, cost};
# las reglas eligen un perfil de modelo. Gana la primera regla que encaja.
# Dos cerebros (D19): el bucle de Skynet con el modelo local (por defecto) y Hermes Agent (motor "hermes"),
# que es la única vía para usar modelos en línea. Coder y las tareas largas van siempre con el bucle de Skynet.

moneda_usd_eur = 0.86      # para convertir el coste que da LiteLLM (USD) a euros

[presupuesto]
mensual_eur = 0            # solo cuenta modelos de pago con precio aquí; los de Hermes los paga Hermes

[modelos.local]
# Modelo local: el que elijas en Ajustes (motor "local" de skynet.toml, llama-server).
litellm = "openai/local"
api_base = "http://127.0.0.1:8090/v1"
api_key = "local"
privado = true             # los datos no salen del PC
coste_entrada_usd_mtok = 0
coste_salida_usd_mtok = 0
max_tokens = 8192
timeout_seg = 900
reasoning_effort = "medium"   # como agente-godot; "low" = más rápido
# Muestreo recomendado por Qwen para pensar y programar (sin esto llama-server usa temperatura 0.8).
# Si ves que repite frases o se queda en bucle, prueba presence_penalty = 1.0 (hasta 1.5).
temperatura = 0.6
top_p = 0.95
top_k = 20
min_p = 0.0
# contexto_tokens = 32768  # sin poner = el "contexto" de [motores.local] en skynet.toml

[modelos.hermes]
# Hermes Agent con el modelo local (alias "local" de Hermes = el llama-server de arriba): privado.
# Hermes usa sus propias herramientas, memoria y skills; Skynet solo le pasa la conversación.
# Necesita encendidos los motores "local" y "hermes" (Ajustes).
litellm = "openai/local"
api_base = "http://127.0.0.1:8642/v1"
api_key_archivo = "data/hermes/api_key"   # la crea el motor "hermes" al arrancar
agente = true
privado = true
coste_entrada_usd_mtok = 0
coste_salida_usd_mtok = 0
max_tokens = 16000
timeout_seg = 3600         # una tarea de Hermes puede durar muchos minutos
contexto_tokens = 128000   # Hermes gestiona su propio contexto

[modelos.hermes-nube]
# Hermes con un modelo en línea (alias "nube"): proveedor y modelo en [motores.hermes].env de skynet.toml y
# la clave del proveedor en el .env de Hermes (C:\Users\HACHO\.hermes-skynet\.env). NO privado: se activa
# con confirmación, como cualquier modelo en línea. El gasto lo cobra el proveedor; Skynet no lo cuenta.
litellm = "openai/nube"
api_base = "http://127.0.0.1:8642/v1"
api_key_archivo = "data/hermes/api_key"
agente = true
motor = "hermes"
privado = false
coste_entrada_usd_mtok = 0
coste_salida_usd_mtok = 0
max_tokens = 16000
timeout_seg = 3600
contexto_tokens = 128000

[[reglas]]
si = { privacy = "alta" }
usar = "local"
motivo = "privacidad alta: siempre local"

[[reglas]]
si = { cost = "bajo" }
usar = "local"
motivo = "tarea larga o barata: local"

[[reglas]]
si = {}
usar = "local"
motivo = "por defecto: local"
