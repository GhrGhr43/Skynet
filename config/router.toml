# Model router: los agentes piden capacidades {privacy, coding, reasoning, cost};
# las reglas eligen un perfil de modelo. Gana la primera regla que encaja.

moneda_usd_eur = 0.86      # para convertir el coste que da LiteLLM (USD) a euros

[presupuesto]
mensual_eur = 0            # 0 = cloud desactivado. Ponlo > 0 cuando tengas la clave.

[modelos.local]
# Modelo local por defecto: Qwen3.6-35B-A3B UD-Q4_K_M en llama-server (motor "local" de skynet.toml); se cambia en Ajustes.
litellm = "openai/local"
api_base = "http://127.0.0.1:8090/v1"
api_key = "local"
privado = true             # los datos no salen del PC
coste_entrada_usd_mtok = 0
coste_salida_usd_mtok = 0
max_tokens = 8192
timeout_seg = 900
reasoning_effort = "medium"   # como agente-godot; "low" = más rápido

[modelos.gemini]
# Gratis (plan gratuito de Google AI Studio). Clave en la variable de entorno GEMINI_API_KEY.
# Ojo: en el plan gratuito Google puede usar los datos; los repos privados van siempre al local.
litellm = "gemini/gemini-flash-latest"
api_key_env = "GEMINI_API_KEY"
privado = false
coste_entrada_usd_mtok = 0
coste_salida_usd_mtok = 0
max_tokens = 16000
timeout_seg = 600

[modelos.omniroute]
# OmniRoute (motor "omniroute" de skynet.toml): un endpoint para varios proveedores cloud. NO privado:
# el router nunca le manda tareas con privacidad alta. Solo se usa si lo eliges en Ajustes. Coste 0
# porque solo lleva proveedores gratis; si le añades claves de pago, el gasto no se contabiliza aquí.
# Combo "skynet" de OmniRoute: solo los proveedores que apruebe Daniel. No se usa "auto" porque
# trae precableado OpenCode Free (sus términos solo permiten usarlo desde OpenCode).
litellm = "openai/skynet"
api_base = "http://127.0.0.1:20128/v1"
api_key = "omniroute"
privado = false
coste_entrada_usd_mtok = 0
coste_salida_usd_mtok = 0
max_tokens = 8192
timeout_seg = 600

[modelos.cloud]
litellm = "anthropic/claude-opus-5-5"
api_key_env = "ANTHROPIC_API_KEY"
privado = false
coste_entrada_usd_mtok = 4.0
coste_salida_usd_mtok = 20.0
max_tokens = 16000
timeout_seg = 600

[[reglas]]
si = { privacy = "alta" }
usar = "local"
motivo = "privacidad alta: siempre local"

[[reglas]]
si = { cost = "bajo" }
usar = "local"
motivo = "tarea larga o barata: local"

[[reglas]]
si = { reasoning = "alto" }
usar = "gemini"
motivo = "razonamiento alto: Gemini (gratis)"

[[reglas]]
si = {}
usar = "local"
motivo = "por defecto: local"
