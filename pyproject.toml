[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS: agente personal sobre un Core modular (Personal Agent OS)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3,<3",
    "litellm>=1.104",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
jarvis = "jarvis.cli:main"

[tool.setuptools]
packages = ["jarvis", "jarvis_tools"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["lmstudio: necesita LM Studio encendido (JARVIS_TEST_LMSTUDIO=1)"]
